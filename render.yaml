services:
  - type: web
    name: transora-backend
    env: node
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npm run build:backend
    startCommand: npm run start --workspace=services/backend
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://transora-web.vercel.app
      - key: STORAGE_MODE
        value: local
      - key: LOCAL_UPLOAD_DIR
        value: ./uploads
